[project]
name = "typedate"
version = "0.1.0"
description = "Data and eval-set tooling for the type-date heuristic parsers"
requires-python = ">=3.11"
dependencies = [
  "typer",
  "rich",
  "datasketch",
]

[project.scripts]
td = "typedate.cli:app"

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typedate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/typedate/datagen/*" = ["E501"]
"src/typedate/zeroshot.py" = ["E501"]
"src/typedate/runwriter.py" = ["E501"]
"src/typedate/cli.py" = ["E501", "B008"]
